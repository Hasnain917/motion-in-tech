<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" fill="none">
  <!-- Geometric Tech Symbol: Dynamic M / Polygon -->
  <g transform="translate(4, 8)">
    <!-- Glow Backdrop -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#00FFD1" fill-opacity="0.08" stroke="#00FFD1" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- Left Pillar -->
    <path d="M16 42V16L28 32V42" fill="url(#neon-grad-1)" />
    <!-- Right Pillar -->
    <path d="M40 42V16L28 32V42" fill="url(#neon-grad-2)" />
    <!-- Dynamic Corner Accent Point -->
    <circle cx="28" cy="18" r="3" fill="#00FFD1" />
  </g>
  
  <!-- Typography -->
  <!-- "MOTION" -->
  <text x="76" y="36" font-family="'Syne', 'Inter', system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">MOTION</text>
  <!-- "IN TECH" -->
  <text x="180" y="36" font-family="'Syne', 'Inter', system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">IN TECH</text>
  <!-- Dot Accent -->
  <circle cx="280" cy="32" r="3.5" fill="#00FFD1"/>
  <!-- Sub-label -->
  <text x="77" y="52" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="0.32em" fill="#888888">SOFTWARE STUDIO</text>

  <defs>
    <linearGradient id="neon-grad-1" x1="16" y1="16" x2="28" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00FFD1"/>
      <stop offset="1" stop-color="#0057FF"/>
    </linearGradient>
    <linearGradient id="neon-grad-2" x1="40" y1="16" x2="28" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00FFD1"/>
      <stop offset="1" stop-color="#00B8D9"/>
    </linearGradient>
  </defs>
</svg>
